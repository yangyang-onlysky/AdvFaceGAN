#############################
#    Base Configuration     #
#############################
[Setting]
mode = target
gpu = 0
n_threads = 2
#############################
#       About Dataset       #
#############################
[Dataset]
# changging to your dataset folder
train_dataset_dir = C:/yy/datasets/CASIA-WebFace/casia-aligned-112x112/
