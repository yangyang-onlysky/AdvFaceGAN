source_adv_loss_factor = 0.15
st_loss_factor = 20.0
MAX_PERTURBATION = 5
MAX_SSIM = 0.92

#############################
#     About Validating      #
#############################
[Val]
val_epoch_size = 200
val_batch_size = 8

val_model_name_list = ['SphereFace','CosFace', 'MobileFace']

#############################
#         About Save        #
#############################
[Save]
